name: release

# 打 v* 标签 → 用 CHANGELOG 里该版本那一段，建一个 GitHub Release 页。
#
# 发布到 npm 已拆到 publish-npm.yml，且只能手动触发（workflow_dispatch）——
# 标签本身不再发布任何东西。两条理由：五语 README 的渠道口径已经是 GitHub；
# npm 侧的账号两步验证还在申诉（工单 #4755194），发布应当是有人按下的动作。
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 幂等：标签重推、或 Release 页已在时，直接跳过，不会红。
      # npm publish alone used to leave every release without a GitHub Release
      # page (v0.5.11 had to be created by hand after the fact); this job closes
      # that gap, and it is now the only thing a tag does.
      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # A CHANGELOG missing this version's section must not fail the job:
          # the tag is the release, and a missing section only costs the notes.
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md || true
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
